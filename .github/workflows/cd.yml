name: CD

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USER }}/api-libros:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 with Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USER }}/api-libros:${{ github.sha }}"
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin
            docker pull "$IMAGE"

            PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' api-libros 2>/dev/null || echo "")

            docker stop api-libros || true
            docker rm api-libros || true

            docker run -d \
              --name api-libros \
              --restart unless-stopped \
              --env-file /home/${{ secrets.EC2_USER }}/.env \
              -e APP_VERSION=${{ github.sha }} \
              -p 127.0.0.1:3000:3000 \
              "$IMAGE"

            sleep 3

            if ! curl -sf http://127.0.0.1/health > /dev/null || ! curl -sf http://127.0.0.1/libros > /dev/null; then
              echo "Verificación fallida. Restaurando versión anterior..."
              docker stop api-libros || true
              docker rm api-libros || true
              if [ -n "$PREV_IMAGE" ]; then
                docker run -d \
                  --name api-libros \
                  --restart unless-stopped \
                  --env-file /home/${{ secrets.EC2_USER }}/.env \
                  -p 127.0.0.1:3000:3000 \
                  "$PREV_IMAGE"
              fi
              exit 1
            fi
